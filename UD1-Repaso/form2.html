<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="get">
        <label>Campo que solo pueda contener tres letras</label>
        <input type="text" name="name" pattern="^[A-Za-z]{3}$">
        <br>

        <label>Campo contraseña que tenga 6 o más carácteres</label>
        <input type="password" name="pass" pattern="^.{6,}$">
        <br>

        <label>Solicita un nombre de usuario de letras minusculas opc. un número de hasta 2 digitos (5-12 caracteres).</label>
        <input type="text" name="username" pattern="^[a-z]{3,10}[0-9]{2, 9}">
        <br>

        <label>Solicita una contraseña puede contener letras mayusculas, minusculas, numeros y los caracteres (! ? -) (8-12 caracteres).</label>
        <input type="password" name="pass" pattern="^[a-zA-Z0-9!\?-]{8,12}$">
        <br>

        <label>EJ5</label>
        <input type="text" name="model" required pattern="[a-zA-z0-9]{5,40}">
        <br>

        <label>EJ6</label>
        <input type="text" name="model2" required pattern="A(1|3|4|15)">
        <br>

        <label>EJ7</label>
        <input type="text" name="patente" pattern="[a-zA-Z]{3}[0-9]{3}">
        <br>

        <label>EJ8</label>
        <input type="text" name="url" pattern="^https?://.+$">
        <br>

        <label>EJ9</label>
        <input type="text" name="num" pattern="[0-9]">
        <br>

        <label>EJ10</label>
        <input type="text" name="email" pattern="^.+@.+\..+$">
        <br>

        <label>EJ11</label>
        <input type="text" name="codP" pattern="[0-9]{5}">
        <br>

        <label>EJ12</label>
        <input type="text" name="fecha" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}">
        <br>
        
        <label>EJ13</label>
        <input type="text" name="telf" pattern="[0-9]{9}">
        <br>

        <label>EJ14</label>
        <input type="password" name="pass" pattern="^(?=.*[A-Z])(?=.*[0-9]).{8,}$">        
        <br>

        <label>EJ15</label>
        <input type="text" name="tarjeta" pattern="[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{4}">
        <br>

        <label>EJ16</label>
        <input type="text" name="CPais" pattern="[A-Z]{2}">
        <br>

        <label>EJ17</label>
        <input type="text" name="Hora" pattern="[0-9]{2}:[0-9]{2}">
        <br>

        <label>EJ18</label>
        <input type="text" name="CProd" pattern="[a-zA-Z]{2}-[0-9]{4}">
        <br>

        <label>EJ19</label>
        <input type="text" name="CDesc" pattern="[a-zA-Z0-9]{6}">
        <br>

        <label></label>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
