<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

<body>
    <h1>Ejerciciio práctico con Tablas</h1>
    <table border="1px" style="border-collapse: collapse">
        <tr>
            <td></td>
            <td colspan="3">
                <img src="/UD1-Repaso/ejercicio7/120_ipod.png" alt="120_ipod" width="150px">
            </td>
            <td colspan="2">
                <img src="/UD1-Repaso/ejercicio7/100_ipod.png" alt="100_ipod" width="150px">

        <tr>

            <th colspan="3">3 pulgadas</th>
            <th colspan="2">7 pulgadas</th>

        <tr>
            <th rowspan="2">Tiempo de carga</th>

        </tr>

            <th>30 minutos para 75%</th>
        </tr>
