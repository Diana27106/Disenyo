<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <section class="banner">
            <div class="slidershow">
                <button class="slider-btn slide-btn-1"></button>
                <button class="slider-btn slide-btn-2"></button>
                <button class="slider-btn slide-btn-3"></button>
                <button class="slider-btn slide-btn-4"></button>
                <div class="slidershow-wrapper">
                    <div class="slide"><img src="./src/slide-img-1.jpg" alt="imagen1"></div>
                    <div class="slide"><img src="./src/slide-img-2.jpg" alt="imagen2"></div>
                    <div class="slide"><img src="./src/slide-img-3.jpg" alt="imagen3"></div>
                    <div class="slide"><img src="./src/slide-img-4.jpg" alt="imagen4"></div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
