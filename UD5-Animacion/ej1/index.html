<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria con imágenes con movimiento</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="main">
        <h1>Galería de imágenes</h1>
        <div class="gallery">

            <div class="gallery__cell">
                <a href="#imagen1" class="picture">
                    <img src="./assets/imagen1.jpg" alt="Imagen 1" class="gallery__item">
                </a>
                <div class="hover"></div>
                <section class="show" id="imagen1">
                    <div class="show__image">
                        <img src="./assets/imagen1.jpg" alt="Imagen 1" class="gallery__item">
                        <a href="#" class="show__close">X</a>
                    </div>
                </section>
            </div>

                        <a href="#" class="show__close">X</a>
                    </div>
                </section>
            </div>

        </div>
    </main>
</body>

</html>
