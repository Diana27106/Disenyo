<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Cursor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="cursor-item crosshair">crosshair</div>
        <div class="cursor-item help">help</div>
        <div class="cursor-item move">move</div>
        <div class="cursor-item pointer">pointer</div>
        
        <div class="cursor-item progress">progress</div>
        <div class="cursor-item text">text</div>
        <div class="cursor-item wait">wait</div>
        <div class="cursor-item vertical-text">vertical-text</div>
        
        <div class="cursor-item alias">alias</div>
        <div class="cursor-item no-drop-1">no-drop</div>
        <div class="cursor-item grab">grab</div>
        <div class="cursor-item grabbing">grabbing</div>
        
        <div class="cursor-item zoom-in">zoom-in</div>
        <div class="cursor-item zoom-out">zoom-out</div>
        <div class="cursor-item not-allowed">not-allowed</div>
        <div class="cursor-item no-drop-2">no-drop</div>
        
        <div class="cursor-item copy">copy</div>
        <div class="cursor-item ew-resize">ew-resize</div>
        <div class="cursor-item ns-resize">ns-resize</div>
        <div class="cursor-item nwse-resize">nwse-resize</div>
        
        <div class="cursor-item nesw-resize">nesw-resize</div>
        <div class="cursor-item col-resize">col-resize</div>
        <div class="cursor-item row-resize">row-resize</div>
        <div class="cursor-item context-menu">context-menu</div>
        
        <div class="cursor-item none">none</div>
        <div class="cursor-item default">Personalized</div>
</body>
</html>
