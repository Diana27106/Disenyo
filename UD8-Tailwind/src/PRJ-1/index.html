<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 Tailwind</title>
    <link rel="stylesheet" href="../output.css">
</head>

<body>
    <section class="w-full h-screen bg-gray-700 flex items-center m-auto justify-center">
        <article
            class="bg-gray-800 flex flex-col justify-content-center items-center text-white w-10/12 rounded-lg lg:flex-row">
            <img src="./image.jpg" alt=""
                class="lg:w-1/3 m-3 h-100 px-3 w-full object-cover rounded-bl-lg rounded-tl-lg">
            <div class=" w-lg-2/3">
                <h1 class=" text-3xl mb-4">Recibe consejos de dieta y fitness en tu bandeja de entrada</h1>
                <p class="mb-4">Come mejor y haz ejercicio mejor. Suscríbete al boletín Diet&Fitness</p>

                <form action="" class="flex lg:flex-row flex-col gap-3">
                    <input type="email" name="email" id="email" class="border border-gray-400 py-2 px-3"
                        placeholder="Inserta tu email">
                    <button type="submit"
                        class="bg-lime-500 text-black py-2 px-3 rounded-md hover:bg-lime-700 hover:text-white transition">Subscribete</button>
                </form>
            </div>
        </article>
    </section>
</body>

</html>
