<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>Grid en Tailwind</title>
</head>

<body class="bg-gray-200 p-10">
    <div class="max-w-5xl mx-auto">
        <h1 class=" text-xl font-semibold">Práctica de Grid en TailwindCSS</h1>
        <section>
            <div class="m-8">
                <div class="card">Número 1</div>
                <div class="card">Número 2</div>
                <div class="card">Número 3</div>
                <div class="card">Número 4</div>
                <div class="card">Número 5</div>
                <div class="card">Número 6</div>
                <div class="card">Número 7</div>
                <div class="card">Número 8</div>
                <div class="card">Número 9</div>
            </div>
        </section>

        <section>
            <div class="m-8 grid grid-cols-4 gap-4">
                <div class="card col-span-2">1</div>
                <div class="card">2</div>
                <div class="card col-[4/5] row-[1/4]">3</div>
                <div class="card row-span-2">4</div>
                <div class="card col-span-2">5</div>
                <div class="card">6</div>
                <div class="card col-start-2 col-end-4">7</div>
                <div class="card">8</div>
                <div class="card col-[2/5]">9</div>
            </div>
        </section>


        <section>
            <div class="m-8 grid grid-cols-2 gap-2">
                <div class="elemento col-[1/3]">header</div>
                <div class="elemento col-[1/3]">nav</div>
                <div class="elemento">section</div>
                <div class="elemento">article</div>
                <div class="elemento row-span-3">aside</div>
                <div class="elemento col-[1/3]">footer</div>
            </div>
        </section>
    </div>
</body>

</html>
