<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>TailwindCSS Colores</title>
</head>

<body>
    <!-- Colores -->
    <p class="text-red-400">Color de texto</p>
    <p class="bg-blue-300 p-4 text-center">Color de fondo</p>

    <hr class="my-10">

    <!-- Botones -->
    <button class="bg-red-500 rounded px-4 py-2">Inicio</button>
    <button class="bg-linear-to-t from-blue-900 to-sky-200 px-4 py-2">NOTICIAS</button>
    <button class="bg-linear-to-l from-blue-900 to-sky-200 px-4 py-2">NOTICIAS</button>
    <button class="bg-red-300 px-4 py-2 rounded-3xl hover:bg-red-400">PLAY</button>

    <hr class="my-10">

    <!-- Opacidad bg-color/porcentaje -->

    <div class="bg-sky-500/10">Opacidad</div>
    <div class="bg-sky-500/20">Opacidad</div>
    <div class="bg-sky-500/30">Opacidad</div>
    <div class="bg-sky-500/40">Opacidad</div>
    <div class="bg-sky-500/50">Opacidad</div>
    <div class="bg-sky-500/60">Opacidad</div>
    <div class="bg-sky-500/70">Opacidad</div>
    <div class="bg-sky-500/80">Opacidad</div>
    <div class="bg-sky-500/90">Opacidad</div>
    <div class="bg-sky-500">Opacidad</div>

    <hr class="my-10">

    <!-- Color personalizado -->
    <h1 class="bg-coral">Color personalizado</h1>
    <hr class="my-10">

</body>

</html>
