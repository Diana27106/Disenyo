<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="clip-path"></div>
    <div class="contenedor-principal">
        <section class="seccion-formulario">
            <h1>Nos mantenemos en contacto</h1>

            <form action="#" method="POST" class="formulario">
                <div class="input-grupo">
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre:" required>
                </div>

                <div class="input-grupo">
                    <input type="email" id="email" name="email" placeholder="Ingresa tu email:" required>
                </div>

                <div class="input-grupo">
                    <textarea id="mensaje" name="mensaje" placeholder="Mensaje..." rows="6" required></textarea>
                </div>

                <button type="submit" class="boton-enviar">Enviar ahora</button>
            </form>
        </section>

        <section class="seccion-ilustracion">
            <img src="./assets/illustration.svg" alt="Ilustración de contacto">
        </section>
    </div>
</body>

</html>
